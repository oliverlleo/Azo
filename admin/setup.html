<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0d2f35">
  <title>AZO Studio — Primeiro acesso</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="login-screen">
    <section class="login-card">
      <div class="login-brand"><span>AZO</span><small>Studio de Conteúdo</small></div>
      <div class="login-copy">
        <p class="eyebrow">Configuração única</p>
        <h1>Criar o primeiro administrador.</h1>
        <p>Esta tela funciona somente uma vez. Depois que o primeiro administrador for criado, o servidor bloqueia novas configurações por aqui.</p>
      </div>
      <form id="setup-form" class="login-form" autocomplete="off">
        <label>Código de configuração<input id="setup-secret" type="password" required autocomplete="off"></label>
        <label>Nome<input id="setup-name" type="text" value="Administrador" maxlength="80" required></label>
        <label>E-mail<input id="setup-email" type="email" required autocomplete="username"></label>
        <label>Senha<input id="setup-password" type="password" minlength="10" required autocomplete="new-password"></label>
        <button class="btn btn-primary" type="submit"><span>Criar administrador</span><b>→</b></button>
        <div class="form-message" id="setup-message" role="status"></div>
      </form>
    </section>
  </main>
  <script type="module" src="setup.js"></script>
</body>
</html>
